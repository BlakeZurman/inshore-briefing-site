<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -24 200 154" width="200" height="154">
  <!-- "Caught a boot": an old leather boot on the hook, swinging and dripping. Captain's Log theme's art for a
       day with no window worth fishing (theme.css). Original drawing. -->
  <style>
    .swing { transform-origin: 100px -24px; animation: swing 2.8s ease-in-out infinite; }
    @keyframes swing { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
    .drip { animation: drip 1.8s ease-in infinite; }
    @keyframes drip { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(24px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .swing, .drip { animation: none; } }
  </style>
  <g class="swing" stroke="#2B1D0E" stroke-linejoin="round" stroke-linecap="round">
    <path d="M82 44 L 116 44 L 117 86 C 117 92, 121 95, 128 96 L 148 98 C 157 99, 160 110, 152 114 L 84 114 C 79 114, 76 110, 77 105 Z" fill="#6B4A2B" stroke-width="3.2"/>
    <path d="M80 44 L 118 44 L 118 53 L 80 53 Z" fill="#5A3C22" stroke-width="2.6"/>
    <path d="M76 107 L 155 109" stroke-width="5"/>
    <path d="M88 60 L 108 66 M108 60 L 88 66 M88 72 L 108 78 M108 72 L 88 78" stroke="#D9C79A" stroke-width="2"/>
    <rect x="124" y="99" width="14" height="9" rx="1.5" fill="#8A6A44" stroke-width="2"/>
    <path d="M126 101 l 2 0 M130 101 l 2 0 M134 101 l 2 0" stroke-width="1"/>
    <path d="M86 58 C 84 72, 86 92, 84 104" stroke="#FFFFFF" stroke-width="3" opacity=".25" fill="none"/>
    <path d="M150 112 C 156 118, 150 122, 156 128" stroke="#4E7F3E" stroke-width="3" fill="none"/>
    <path d="M98 114 C 96 120, 102 122, 99 128" stroke="#4E7F3E" stroke-width="2.6" fill="none"/>
    <!-- line and hook, caught over the cuff -->
    <path d="M100 -24 L 100 38" stroke-width="1.6" fill="none"/>
    <path d="M100 38 L 100 50 C 100 59, 89 59, 89 51 L 92 48" stroke="#8C8C8C" stroke-width="3" fill="none"/>
    <path d="M100 38 L 100 50 C 100 59, 89 59, 89 51 L 92 48" stroke="#2B1D0E" stroke-width="1" fill="none" opacity=".6"/>
    <path class="drip" d="M118 116 C 116 120, 116 122, 118 123 C 120 122, 120 120, 118 116 Z" fill="#7FB9C9" stroke-width="1.4"/>
  </g>
</svg>
